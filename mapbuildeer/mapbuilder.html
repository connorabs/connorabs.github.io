<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu!mania Sim - Map Builder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="builder.css">
</head>
<body>
    <div id="top-bar">
        <h1>Map Builder</h1>
        <div class="controls">
            <input type="file" id="audio-upload" accept="audio/*">
            <label>BPM: <input type="number" id="bpm-input" value="120"></label>
            <label>Offset (s): <input type="number" id="offset-input" value="0.0" step="0.01"></label>
            <label>Snap: 
                <select id="snap-input">
                    <option value="1">1/1</option>
                    <option value="2">1/2</option>
                    <option value="4" selected>1/4</option>
                    <option value="8">1/8</option>
                    <option value="3">1/3</option>
                    <option value="6">1/6</option>
                </select>
            </label>
            <button id="import-btn">Import JSON Map</button>
            <input type="file" id="map-upload" accept=".json" style="display:none;">
            <button id="import-osz-btn">Import .osz Map</button>
            <input type="file" id="osz-upload" accept=".osz" style="display:none;">
            <button id="export-btn">Export Map JSON</button>
            <a href="index.html" class="back-btn">Back to Game</a>
        </div>
    </div>
    
    <div id="workspace">
        <div id="sidebar">
            <div class="sidebar-tabs">
                <button id="tab-tools" class="active">Tools</button>
                <button id="tab-json">JSON Editor</button>
            </div>
            
            <div id="tools-panel" style="display: flex; flex-direction: column; gap: 20px; flex: 1;">
                <div>
                    <h3>Tools</h3>
                    <div class="tool-group">
                        <label><input type="radio" name="tool" value="note" checked> Single Note</label>
                        <label><input type="radio" name="tool" value="ln"> Long Note</label>
                        <label><input type="radio" name="tool" value="delete"> Delete</label>
                    </div>
                </div>
                
                <div>
                    <h3>Pattern Stamper</h3>
                    <div class="tool-group">
                        <label><input type="radio" name="tool" value="stamp"> Stamp Pattern</label>
                        <select id="pattern-select"></select>
                    </div>
                </div>
                
                <div>
                    <h3>Playback & Looping</h3>
                    <div class="tool-group">
                        <label><input type="checkbox" id="autoplay-checkbox"> Autoplay Hitsounds</label>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <button id="loop-start-btn" style="flex:1;">Set Loop Start</button>
                            <button id="loop-end-btn" style="flex:1;">Set Loop End</button>
                        </div>
                        <button id="loop-clear-btn" style="margin-top:5px; width:100%;">Clear Loop</button>
                    </div>
                </div>
                
                <div class="instructions">
                    <p><strong>Space:</strong> Play/Pause</p>
                    <p><strong>Click Canvas:</strong> Seek Audio or Place Note</p>
                    <p><strong>Scroll:</strong> Move Timeline</p>
                    <p><strong>Ctrl+Scroll:</strong> Zoom Timeline</p>
                </div>
            </div>

            <div id="json-panel" style="display: none; flex-direction: column; flex: 1; gap: 10px;">
                <textarea id="json-editor" style="flex: 1; resize: none; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px; font-family: monospace; font-size: 11px; white-space: pre; overflow: auto;"></textarea>
                <button id="json-apply-btn" style="padding: 10px; background: var(--hit-line-color); color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Apply Changes</button>
            </div>
        </div>
        
        <div id="canvas-container">
            <canvas id="builder-canvas"></canvas>
            <div id="time-display">0:00.000</div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="patterns.js"></script>
    <script src="oszParser.js"></script>
    <script src="builder.js"></script>
</body>
</html>
